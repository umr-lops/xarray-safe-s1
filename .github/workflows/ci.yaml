name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-skip-ci-trigger:
    name: "Detect CI Trigger: [skip-ci]"
    if: |
      github.repository == 'umr-lops/xarray-safe-s1'
      && (
          github.event_name == 'push' || github.event_name == 'pull_request'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: xarray-contrib/ci-trigger@v1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  ci:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: detect-skip-ci-trigger

    if: needs.detect-skip-ci-trigger.outputs.triggered == 'false'

    permissions:
      # forked pull_request runs are downgraded to read-only by GitHub
      contents: write # push the coverage badge/data to the python-coverage-comment-action-data branch
      pull-requests: write # coverage comment on pull requests from this repository

    env:
      # coverage is reported from a single job
      COVERAGE_JOB: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13' }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      # pull requests: oldest and newest supported python on linux only (2 jobs).
      # push on main: also macOS and Windows with the newest python.
      matrix:
        python-version: ["3.10", "3.13"]
        os: ["ubuntu-latest"]
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"os":"macos-latest","python-version":"3.13"},{"os":"windows-latest","python-version":"3.13"}]') }}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          # need to fetch all tags to get a correct version
          fetch-depth: 0 # fetch all branches and tags

      - name: Setup environment variables
        run: |
          echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

          echo "CONDA_ENV_FILE=ci/requirements/environment.yaml" >> $GITHUB_ENV

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ env.CONDA_ENV_FILE }}
          environment-name: xarray-safe-s1-tests
          cache-environment: true
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-py${{matrix.python-version}}-${{env.TODAY}}-${{hashFiles(env.CONDA_ENV_FILE)}}"
          create-args: >-
            python=${{matrix.python-version}}

      - name: Install xarray-safe-s1
        run: |
          python -m pip install --no-deps -e .

      - name: Import xarray-safe-s1
        run: |
          python -c "import safe_s1"

      - name: Run tests
        run: |
          python -m pytest --cov=safe_s1

      - name: Coverage comment and badge
        id: coverage_comment
        if: env.COVERAGE_JOB == 'true'
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store the pull request comment to be posted
        uses: actions/upload-artifact@v7
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
